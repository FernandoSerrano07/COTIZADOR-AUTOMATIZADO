<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { min-height: 100vh; overflow-x: hidden; }
        .sidebar { width: 250px; position: fixed; top: 0; left: 0; height: 100%; background: #1A252C; color: #fff; padding-top: 20px; }
        .sidebar a { color: #cfd8dc; text-decoration: none; display: block; padding: 12px 20px; transition: 0.2s; }
        .sidebar a:hover, .sidebar a.active { background: #0056b3; color: #fff; }
        .main-content { margin-left: 250px; padding: 30px; }
    </style>
</head>
<body class="bg-light">

    <!-- MENÚ LATERAL UNIFICADO -->
    <div class="sidebar">
        <h4 class="text-center text-white mb-4">Seguridad y Redes</h4>
        <a href="/dashboard"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="/productos"><i class="fas fa-box me-2"></i> Productos</a>
        <a href="/cotizaciones"><i class="fas fa-file-invoice-dollar me-2"></i> Cotizaciones</a>
        <a href="/configuracion"><i class="fas fa-cog me-2"></i> Configuración</a>
        <hr class="text-secondary mx-3">
        <a href="/login" class="text-danger"><i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión</a>
    </div>

    <!-- CONTENIDO DINÁMICO DE CADA PÁGINA -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
